name: Deploy demo sites to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['sites/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy changed sites
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            SITES=$(ls sites)
          else
            SITES=$(git diff --name-only HEAD~1 HEAD -- sites | cut -d/ -f2 | sort -u)
          fi
          for s in $SITES; do
            [ -d "sites/$s" ] || continue
            echo "== $s =="
            npx -y wrangler@4 pages project create "$s" --production-branch main 2>/dev/null || true
            npx -y wrangler@4 pages deploy "sites/$s" --project-name "$s" --branch main --commit-dirty=true
            echo "LIVE: https://$s.pages.dev"
          done
